<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost https://ddragon.leagueoflegends.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://opgg-static.akamaized.net https://ddragon.leagueoflegends.com; script-src 'self' 'unsafe-inline';">
  <title>VaultX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app"></div>

<!-- Normal mode: sidebar + detail -->
<template id="normal-shell">
  <div class="shell">
    <aside class="side">
      <div class="side-brand" data-tauri-drag-region>
        <img src="icon.svg" alt="">
        <span class="bar-title" data-tauri-drag-region>VaultX</span>
      </div>
      <div class="side-controls">
        <select id="sort-select" title="Sort accounts">
          <option value="highest">Highest rank</option>
          <option value="lowest">Lowest rank</option>
          <option value="region">Region</option>
        </select>
        <button class="add-btn" id="add-account-btn" aria-label="Add account" title="Add account"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="side-list" id="account-list"></div>
      <div class="side-actions">
        <button class="btn ghost toggle" id="auto-accept-header-btn" title="Automatically accept the match-found screen">Auto-accept</button>
        <button class="btn ghost" id="lobby-viewer-btn">Lobby</button>
        <button class="btn ghost" id="refresh-all-btn">Refresh all</button>
        <button class="btn ghost" id="settings-btn">Settings</button>
      </div>
    </aside>
    <main class="detail-pane">
      <div class="win-row">
        <div class="drag" data-tauri-drag-region></div>
        <button class="icon-btn" id="lock-btn" aria-label="Lock vault" title="Lock vault"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
        <button class="win" id="tb-minimize" aria-label="Minimize" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5h10"/></svg></button>
        <button class="win" id="tb-maximize" aria-label="Maximize" title="Maximize"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
        <button class="win close" id="tb-close" aria-label="Close" title="Close"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
      </div>
      <div class="detail" id="detail"></div>
      <div class="empty hidden" id="empty-state"><strong>No accounts yet</strong><span>Add your first one to get started.</span></div>
    </main>
  </div>
</template>

<!-- Low performance mode: compact text list, no images -->
<template id="low-shell">
  <div class="bar" data-tauri-drag-region>
    <span class="bar-title" data-tauri-drag-region>VaultX</span>
    <div class="bar-spacer" data-tauri-drag-region></div>
    <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    <button class="icon-btn" id="lock-btn" aria-label="Lock vault" title="Lock vault"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    <button class="win" id="tb-minimize" aria-label="Minimize" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5h10"/></svg></button>
    <button class="win" id="tb-maximize" aria-label="Maximize" title="Maximize"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
    <button class="win close" id="tb-close" aria-label="Close" title="Close"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
  </div>
  <div class="toolbar">
    <h1>Accounts</h1>
    <span class="count" id="account-count"></span>
    <select id="sort-select" title="Sort accounts">
      <option value="highest">Highest rank</option>
      <option value="lowest">Lowest rank</option>
      <option value="region">Region</option>
    </select>
    <div class="toolbar-spacer"></div>
    <button class="btn ghost toggle" id="auto-accept-header-btn" title="Automatically accept the match-found screen">Auto-accept</button>
    <button class="btn ghost" id="lobby-viewer-btn">Lobby</button>
    <button class="btn ghost" id="refresh-all-btn">Refresh all</button>
    <button class="btn primary" id="add-account-btn">Add account</button>
  </div>
  <div class="list">
    <div id="account-list"></div>
    <div class="empty hidden" id="empty-state"><strong>No accounts yet</strong><span>Add your first one to get started.</span></div>
  </div>
</template>

<!-- Add / Edit -->
<div class="overlay hidden" id="account-modal">
  <div class="modal wide">
    <h3 id="modal-title">Add account</h3>
    <input type="hidden" id="edit-id">
    <div class="fields">
      <label class="field">Label
        <input type="text" id="field-label" placeholder="Main, Smurf, Alt" maxlength="30">
      </label>
      <label class="field">Riot ID
        <input type="text" id="field-riotid" placeholder="GameName#TAG" autocomplete="off">
      </label>
      <label class="field">Username
        <input type="text" id="field-username" autocomplete="off">
      </label>
      <label class="field">Password
        <input type="password" id="field-password" autocomplete="new-password">
      </label>
      <label class="field">Region
        <select id="field-region">
          <option value="NA">NA</option>
          <option value="EUW">EUW</option>
          <option value="EUNE">EUNE</option>
          <option value="KR">KR</option>
          <option value="JP">JP</option>
          <option value="BR">BR</option>
          <option value="LAN">LAN</option>
          <option value="LAS">LAS</option>
          <option value="OCE">OCE</option>
          <option value="TR">TR</option>
          <option value="RU">RU</option>
        </select>
      </label>
    </div>
    <p id="modal-error" class="error hidden"></p>
    <div class="modal-actions">
      <button class="btn danger left hidden" id="modal-delete-btn">Delete</button>
      <button class="btn" id="modal-cancel-btn">Cancel</button>
      <button class="btn primary" id="modal-save-btn">Save</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="overlay hidden" id="settings-panel">
  <div class="modal wide">
    <h3>Settings</h3>
    <div class="field">Appearance
      <div class="segmented">
        <button id="mode-normal">Normal</button>
        <button id="mode-low">Low performance</button>
      </div>
    </div>
    <div class="mode-lines hint" id="mode-lines"></div>
    <div class="restart-row hidden" id="mode-restart-row">
      <span class="hint">VaultX restarts to apply this and locks your vault.</span>
      <button class="btn primary" id="mode-restart-btn">Restart</button>
    </div>
    <label class="check"><input type="checkbox" id="startup-toggle"> Launch on Windows startup</label>
    <p class="hint" id="update-status-text"></p>
    <div class="modal-actions">
      <span class="hint left" id="update-current-version"></span>
      <button class="btn" id="check-updates-btn">Check for updates</button>
      <button class="btn primary hidden" id="install-update-btn">Install update</button>
      <button class="btn" id="settings-close-btn">Close</button>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="overlay hidden" id="delete-modal">
  <div class="modal">
    <p id="delete-modal-msg"></p>
    <div class="modal-actions">
      <button class="btn" id="delete-cancel-btn">Cancel</button>
      <button class="btn danger" id="delete-confirm-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Lobby -->
<div class="overlay hidden" id="lobby-modal">
  <div class="modal wide">
    <h3>Lobby</h3>
    <p class="hint" id="lobby-meta"></p>
    <div class="lobby-list" id="lobby-list"></div>
    <p id="lobby-error" class="error hidden"></p>
    <div class="modal-actions">
      <button class="btn left" id="lobby-open-opgg-btn">op.gg</button>
      <button class="btn" id="lobby-open-tracker-btn">Tracker</button>
      <button class="btn" id="lobby-refresh-btn">Refresh</button>
      <button class="btn primary" id="lobby-done-btn">Done</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
