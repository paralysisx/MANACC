<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'self' 'unsafe-inline';">
  <title>VaultX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <img class="login-mark hidden" id="login-mark" src="mark.svg" alt="">
  <div class="bar" data-tauri-drag-region>
    
    <div class="bar-spacer" data-tauri-drag-region></div>
    <button class="win" id="tb-minimize" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5h10"/></svg></button>
    <button class="win close" id="tb-close" title="Close"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
  </div>

  <div class="login">
    <h1 class="login-title">VaultX</h1>

    <!-- First-time setup -->
    <div id="setup-section" class="hidden">
      <input type="password" id="setup-password" placeholder="Choose a PIN (6+ characters)" aria-label="Choose a PIN" autocomplete="new-password">
      <input type="password" id="setup-confirm" placeholder="Repeat PIN" aria-label="Repeat PIN" autocomplete="new-password">
      <button class="btn primary" id="setup-btn">Create vault</button>
      <p class="hint login-note">A forgotten PIN can't be recovered.</p>
    </div>

    <!-- Unlock existing vault -->
    <div id="unlock-section" class="hidden">
      <input type="password" id="unlock-password" placeholder="Enter your PIN" aria-label="PIN" autocomplete="current-password">
      <button class="btn primary" id="unlock-btn">Unlock</button>
      <button class="btn-link" id="forgot-pin-btn">Reset Vault</button>

      <div id="reset-confirm-box" class="hidden">
        <p class="error login-note">This permanently deletes all stored accounts.</p>
        <div class="modal-actions">
          <button class="btn" id="reset-cancel-btn">Cancel</button>
          <button class="btn danger" id="reset-confirm-btn">Reset Vault</button>
        </div>
      </div>
    </div>

    <p id="login-error" class="error login-note hidden"></p>
    <p id="login-loading" class="hint login-note hidden"><span class="loader"></span>Unlocking...</p>
  </div>

  <script>
    // ─── Tauri IPC ────────────────────────────────────────────────────────────
    const { invoke } = window.__TAURI__.core;
    const { getCurrentWindow } = window.__TAURI__.window;
    const appWindow = getCurrentWindow();

    document.getElementById('tb-minimize').addEventListener('click', () => appWindow.minimize());
    document.getElementById('tb-close').addEventListener('click', () => appWindow.close());

    // ─── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      const exists = await invoke('vault_exists');
      if (exists) {
        document.getElementById('unlock-section').classList.remove('hidden');
      } else {
        document.getElementById('setup-section').classList.remove('hidden');
      }
    }

    // Clicking a field swaps its hint for a faint row of dots.
    document.querySelectorAll('.login input').forEach(input => {
      const hint = input.placeholder;
      input.addEventListener('focus', () => { input.placeholder = '••••••••'; });
      input.addEventListener('blur', () => { input.placeholder = hint; });
    });

    // A short pulse on Unlock. Restarted on every click, and it stops by itself.
    const unlockBtn = document.getElementById('unlock-btn');
    unlockBtn.addEventListener('click', () => {
      unlockBtn.classList.remove('pulse');
      void unlockBtn.offsetWidth;
      unlockBtn.classList.add('pulse');
    });
    unlockBtn.addEventListener('animationend', () => unlockBtn.classList.remove('pulse'));

    // Nothing is focused on load, so the hint stays visible until the field is
    // clicked. Typing straight away still works: the first key focuses the field.
    document.addEventListener('keydown', (e) => {
      if (document.activeElement?.tagName === 'INPUT') return;
      if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;
      const section = document.getElementById('unlock-section').classList.contains('hidden') ? 'setup-password' : 'unlock-password';
      const input = document.getElementById(section);
      if (!input.disabled) input.focus();
    });

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('login-loading').classList.add('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    function setLoading(on) {
      document.getElementById('login-loading').classList.toggle('hidden', !on);
      document.getElementById('setup-btn').disabled = on;
      document.getElementById('unlock-btn').disabled = on;
    }

    // Navigate to main window (resize + load index.html)
    async function openMain() {
      const { LogicalSize } = window.__TAURI__.dpi;
      await appWindow.setResizable(true);
      const low = window.__VAULTX_LOW__ === true;
      await appWindow.setMinSize(low ? new LogicalSize(640, 300) : new LogicalSize(900, 560));
      await appWindow.setSize(low ? new LogicalSize(760, 440) : new LogicalSize(1150, 760));
      window.location.href = 'index.html';
    }

    // ─── Create Vault ─────────────────────────────────────────────────────────
    document.getElementById('setup-btn').addEventListener('click', async () => {
      const pw      = document.getElementById('setup-password').value;
      const confirm = document.getElementById('setup-confirm').value;
      if (pw.length < 6) return showError('PIN must be at least 6 characters.');
      if (pw !== confirm) return showError('PINs do not match.');
      setLoading(true);
      try {
        await invoke('create_vault', { password: pw });
        await openMain();
      } catch (err) {
        setLoading(false);
        showError(err || 'Failed to create vault.');
      }
    });

    // ─── Unlock ───────────────────────────────────────────────────────────────
    document.getElementById('unlock-btn').addEventListener('click', async () => {
      const pw = document.getElementById('unlock-password').value;
      if (!pw) return showError('Enter your PIN.');
      setLoading(true);
      try {
        await invoke('unlock', { password: pw });
        await openMain();
      } catch (err) {
        setLoading(false);
        showError(err || 'Incorrect PIN.');
      }
    });

    // ─── Reset Vault ──────────────────────────────────────────────────────────
    function showResetConfirm(show) {
      document.getElementById('reset-confirm-box').classList.toggle('hidden', !show);
      document.getElementById('forgot-pin-btn').classList.toggle('hidden', show);
      document.getElementById('unlock-btn').disabled = show;
      document.getElementById('unlock-password').disabled = show;
    }

    document.getElementById('forgot-pin-btn').addEventListener('click', () => showResetConfirm(true));

    document.getElementById('reset-cancel-btn').addEventListener('click', () => {
      showResetConfirm(false);
      document.getElementById('unlock-password').focus();
    });

    document.getElementById('reset-confirm-btn').addEventListener('click', async () => {
      try {
        await invoke('reset_vault');
        document.getElementById('unlock-section').classList.add('hidden');
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('setup-password').focus();
      } catch (err) {
        showResetConfirm(false);
        showError(err || 'Failed to reset vault.');
      }
    });

    document.getElementById('unlock-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('unlock-btn').click();
    });
    document.getElementById('setup-confirm').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('setup-btn').click();
    });

    // ─── Auto update ──────────────────────────────────────────────────────────
    // Runs before unlock so an update's restart doesn't throw away an open session.
    async function autoUpdate() {
      if (localStorage.getItem('autoCheckUpdates') === 'false') return;
      try {
        const update = await window.__TAURI__.updater.check();
        if (update) await update.downloadAndInstall();
      } catch (err) {
        console.warn('Auto-update failed:', err);
      }
    }

    // Low performance mode draws no images.
    if (window.__VAULTX_LOW__ !== true) document.getElementById('login-mark').classList.remove('hidden');
    init();
    autoUpdate();
  </script>
</body>
</html>
